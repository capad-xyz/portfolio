# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
language: en-US
tone_instructions: >-
  Be direct and concise. Skip praise and filler. Lead with the problem, then the
  fix. This is a personal portfolio site: weight correctness, performance, and
  accessibility over architectural preferences, and do not relitigate the
  design system.

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  in_progress_fortune: false
  collapse_walkthrough: true
  sequence_diagrams: false

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - main
    ignore_title_keywords:
      - wip
      - "[skip ci]"

  path_filters:
    - "!node_modules/**"
    - "!.next/**"
    - "!.open-next/**"
    - "!.wrangler/**"
    - "!.wrangler-dryrun/**"
    - "!public/**"
    - "!patches/**"
    - "!package-lock.json"
    - "!tsconfig.tsbuildinfo"
    - "!next-env.d.ts"

  path_instructions:
    - path: "src/app/**/*.{ts,tsx}"
      instructions: >-
        Next.js 16 App Router on Cloudflare Workers via OpenNext. Flag Node-only
        APIs used in code that runs on the Workers runtime, missing or wrong
        route segment config, and server-only values leaking into client
        components. Check that dynamic routes handle a missing or unpublished
        Sanity document instead of throwing.
    - path: "src/app/api/**/*.ts"
      instructions: >-
        API routes. The contact endpoint must validate and rate-limit input and
        must not echo submitted content back unescaped. The revalidate endpoint
        must verify its webhook secret before doing any work. Flag secrets read
        into client-reachable scope and any unhandled rejection that would
        return a 500 with internal detail.
    - path: "src/components/**/*.tsx"
      instructions: >-
        Glass design system with WebGL and scroll-driven motion. Flag effects
        that do not clean up (GSAP timelines, Lenis instances, R3F loops,
        observers, listeners), animation work running on every scroll frame
        without throttling, and heavy WebGL mounted eagerly instead of lazily.
        Check prefers-reduced-motion is respected, and that interactive glass
        surfaces keep visible focus states and sufficient contrast.
    - path: "src/sanity/schemas/**/*.ts"
      instructions: >-
        CMS schemas. A field change is a content migration: flag renames or
        type changes to existing fields that would orphan published content.
        Check required and validation rules match how the front end consumes
        the field.
    - path: "src/lib/**/*.ts"
      instructions: >-
        Sanity client and data helpers. Check GROQ queries request only the
        fields used, that caching and revalidation tags are set intentionally,
        and that draft or unpublished content cannot leak into production
        responses.
    - path: "**/*.md"
      instructions: >-
        Only flag factual errors, broken links, and stale commands. Ignore prose
        style.

  tools:
    eslint:
      enabled: true
    gitleaks:
      enabled: true
    actionlint:
      enabled: true
    markdownlint:
      enabled: true
    # Project lints through eslint only; these would duplicate findings.
    biome:
      enabled: false
    oxc:
      enabled: false

chat:
  art: false
  auto_reply: true

knowledge_base:
  learnings:
    scope: auto
  issues:
    scope: auto
